[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "pybind11>=2.5.0",
    "jax>=0.11.1"
]
build-backend = "setuptools.build_meta"

[project]
name = "xolky"
version = "0.1.0"
description = "Sparse Cholesky solves with CHOLMOD or cuDSS from JAX."
authors = [
    { name = "Pedro Zuidberg Dos Martires" }
]
dependencies = [
    "jax>=0.11.1",
    "numpy>=2.0",
    "pybind11>=2.5.0"
]

[project.optional-dependencies]
cuda13 = [
    "jax[cuda13]>=0.11.1"
]
test = [
    "pytest>=9.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires the optional CUDA/cuDSS backend"
]
